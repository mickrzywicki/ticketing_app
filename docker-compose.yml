services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  core:
    build: ./services/core
    env_file: ./services/core/.env.example
    environment: &core-env
      DATABASE_URL: postgres://helpdesk:helpdesk@db:5432/helpdesk
      REDIS_URL: redis://redis:6379/0
      NOTIFIER_URL: http://notifier:5000
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./services/core:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy

  # Celery worker: same image and code as core, different command (like a Sidekiq process).
  worker:
    build: ./services/core
    env_file: ./services/core/.env.example
    environment: *core-env
    command: celery -A config worker -l info
    volumes:
      - ./services/core:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  notifier:
    build: ./services/notifier
    # Dev only: mount the code and reload Gunicorn on changes (no image rebuild needed).
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --reload "notifier:create_app()"
    ports:
      - "5001:5000"
    volumes:
      - ./services/notifier:/app
      - /app/.venv

volumes:
  pgdata:
